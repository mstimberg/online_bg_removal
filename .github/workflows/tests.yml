name: Test Project with UV

on: [push, pull_request]

jobs:
    test-uv:
        name: Test uv install (${{ matrix.os }} / ${{ matrix.python-version }})
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                python-version: [3.12]

        steps:
        - name: Checkout repository
          uses: actions/checkout@v2

        - name: Install Qt
          uses: jurplel/install-qt-action@v4
          with:
            version: 6.8.2
            aqtversion: '>=3.2.0'

        - name: Install uv
          uses: astral-sh/setup-uv@v5
          with:
            enable-cache: true
            python-version: ${{ matrix.python-version }}
        
        - name: Install the project
          run: uv sync
        
        - name: Run the GUI
          run: uv run background_remover.pyw
          env:
            QT_QPA_PLATFORM: offscreen
            TEST_SHUTDOWN_GUI: 1

    test-pixi:
        name: Test pixi install ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        
        steps:
        - name: Checkout repository
          uses: actions/checkout@v2
        
        - name: Install pixi
          uses: prefix-dev/setup-pixi@v0.8.0
          with:
            cache: true

        - name: Run the GUI
          run: pixi run gui
          env:
            QT_QPA_PLATFORM: offscreen
            TEST_SHUTDOWN_GUI: 1
    
    test-pip:
      name: Test pip install ${{ matrix.os }} / ${{ matrix.python-version }})
      runs-on: ${{ matrix.os }}
      strategy:
          matrix:
              os: [ubuntu-latest, windows-latest, macos-latest]
              python-version: [3.12]
      steps:
        - name: Checkout repository
          uses: actions/checkout@v2
        - uses: actions/setup-python@v5
          with:
            python-version: ${{ matrix.python-version }}
            cache: 'pip'
        - name: Install Qt
          uses: jurplel/install-qt-action@v4
          with:
            version: 6.8.2
            aqtversion: '>=3.2.0'
        - name: Install dependencies
          run: pip install -r requirements.txt
        - name: Run the GUI
          run: python background_remover.pyw
          env:
            QT_QPA_PLATFORM: offscreen
            TEST_SHUTDOWN_GUI: 1